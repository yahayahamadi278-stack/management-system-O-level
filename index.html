<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>O-Level Student Management System</h1>

    <!-- FORM -->
    <div class="form-container">
        <h2>Register Student</h2>
        <form id="studentForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="text" id="id" placeholder="Student ID" required>
            <input type="number" id="age" placeholder="Age" required>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <select id="form" required>
                <option value="">Select Form</option>
                <option value="1">Form 1</option>
                <option value="2">Form 2</option>
                <option value="3">Form 3</option>
                <option value="4">Form 4</option>
            </select>

            <button type="submit">Add Student</button>
        </form>
        <!-- SEARCH + VIEW -->
<div class="search-section">
    <h3>Search Student</h3>
    <input type="text" id="searchInput" placeholder="Enter Name or ID">
    <div class="search-buttons">
        <button id="searchBtn" onclick="handleSearch()">Search</button>
        <button id="clearBtn" onclick="clearSearch()" class="clear-btn">Clear</button>
    </div>
    <!-- RESULT -->
    <div id="searchResult"></div>
</div>
    </div>


    <!-- TABLE -->
    <div class="table-container">
        <h2>Student List</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Form</th>
                    <th>Average</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

    <!-- PERFORMANCE -->
    <div id="performanceSection" class="hidden">
        <h2>Add Performance</h2>

        <input type="number" id="mathematics" placeholder="Mathematics">
        <input type="number" id="english" placeholder="English">
        <input type="number" id="science" placeholder="Science">
        <input type="number" id="socialStudies" placeholder="Social Studies">

        <button onclick="savePerformance()">Save Performance</button>
    </div>

<script src="script.js"></script>
</body>
</html>
